name: Lean verification

on:
  pull_request:
    paths:
      - "formal/**"
      - "network.py"
      - "fixedq.py"
      - "tests/test_formal_bridge.py"
      - ".github/workflows/lean-verification.yml"
  push:
    branches: [main]
    paths:
      - "formal/**"
      - "network.py"
      - "fixedq.py"
      - "tests/test_formal_bridge.py"
      - ".github/workflows/lean-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conservation:
    # Parent PR #401 supplies the shared verifier and required formal CI lane.
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-lean-verify.yml@27dedd9651efc816fa88d8922adb5f242725df69
    with:
      project-directory: formal
      proof: Conservation.lean
      theorems: |
        FFSS.transfer_conserves
        FFSS.transfer_nonnegative
        FFSS.queue_push_conserves
        FFSS.delayed_transfer_conserves
        FFSS.delayed_transfer_nonnegative

