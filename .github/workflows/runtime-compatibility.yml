name: Stdlib runtime compatibility

# 実行時は標準ライブラリだけ（python -S、サードパーティなし）で動くことを確かめる。
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-stdlib-runtime.yml@2e450118fde453272de9997608e25c31a984463c
    with:
      python-versions: '["3.11","3.15"]'
      extra-runners: '[{"os":"windows-latest","python":"3.15"},{"os":"macos-latest","python":"3.15"}]'
      commands: |
        python -S -m unittest discover -s tests -v
        python -S fluidfullspeedsimulation.py verify
