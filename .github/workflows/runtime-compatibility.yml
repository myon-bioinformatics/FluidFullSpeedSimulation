name: Stdlib runtime compatibility

# 実行時は標準ライブラリだけ（python -S、サードパーティなし）で動くことを確かめる。
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  schedule:
    - cron: "20 19 * * *" # 毎日 04:20 JST

permissions:
  contents: read

jobs:
  runtime:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-stdlib-runtime.yml@43cfe1df924ea96ca44f47a6771c18102c38f7f3
    with:
      # PR は ubuntu 3.15 だけ。push（main）と schedule は ubuntu 3.11・3.15 に Windows・macOS 3.15 を足す。
      python-versions: ${{ github.event_name == 'pull_request' && '["3.15"]' || '["3.11","3.15"]' }}
      extra-runners: ${{ github.event_name == 'pull_request' && '[]' || '[{"os":"windows-latest","python":"3.15"},{"os":"macos-latest","python":"3.15"}]' }}
      # unittest already runs every experiment (test_every_experiment_passes); one CLI run keeps the `python -S script` path
      commands: |
        python -S -m unittest discover -s tests -v
        python -S fluidfullspeedsimulation.py run E01
